{% extends "base.html" %}
{% block title %}{{ _('Associate Code') }} | Fresado Pro{% endblock %}
{% block instructions %}
<div class="alert alert-info d-flex align-items-center" role="alert">
  <i class="bi bi-link-45deg me-2"></i>
  {{ _('Associate scanned codes to orders or blocks. Select and confirm to continue.') }}
</div>
{% endblock %}
{% block content %}
<div class="card border-0 shadow-sm animate__animated animate__fadeInUp">
  <div class="card-body">
    <h3 class="mb-3"><i class="bi bi-link-45deg"></i> {{ _('Associate Code') }}</h3>
    <form method="post" class="row g-3">
      <div class="col-md-8">
        <label class="form-label">{{ _('Scanned Code') }}</label>
        <input type="text" name="codigo_escaneado" class="form-control" required>
      </div>
      <div class="col-md-4 d-flex align-items-end">
        <button type="submit" class="btn btn-primary w-100"><i class="bi bi-link"></i> {{ _('Associate') }}</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}

<!DOCTYPE html>
<html>
<head>
    <title>{{ _('Order Registration') }}</title>
</head>
<body>
    <h1>{{ _('Register New Order') }}</h1>
    <form method="POST">
        <label>{{ _('Order Code:') }}</label><br>
        <input type="text" name="codigo_orden" required><br><br>

        <label>{{ _('Material:') }}</label><br>
        <input type="text" name="material" required><br><br>

        <label>{{ _('Barcode:') }}</label><br>
        <input type="text" name="codigo_barra" required><br><br>

        <label>{{ _('Machine:') }}</label><br>
        <select name="maquina" required>
            <option value="">{{ _('Select') }}</option>
            <option value="A">{{ _('Machine A') }}</option>
            <option value="B">{{ _('Machine B') }}</option>
            <option value="C">{{ _('Machine C') }}</option>
            <option value="D">{{ _('Machine D') }}</option>
        </select><br><br>

        <button type="submit">{{ _('Register') }}</button>
    </form>
</body>
</html>
